<script>
const clock=document.getElementById('clock');
const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function tick(){
 const p=Object.fromEntries(fmt.formatToParts(new Date()).map(x=>[x.type,x.value]));
 clock.textContent=`${Number(p.year)-1911}/${p.month}/${p.day} ${p.hour}:${p.minute}:${p.second}`;
}
tick();setInterval(tick,1000);

// 點擊原圖的上鎖日期時間即可編輯；設定儲存在本機，重開網頁仍保留。
const lockDateText=document.getElementById('lockDateText');
const lockDatePicker=document.getElementById('lockDatePicker');
const LOCK_DATE_KEY='mdm_v4_lock_datetime';
const DEFAULT_LOCK_DATETIME='2026-10-27T06:57:53';
function formatRocDateTime(value){
 const [date,time='00:00:00']=value.split('T');
 const [year,month,day]=date.split('-').map(Number);
 const [hour='00',minute='00',second='00']=time.split(':');
 return `${year-1911}/${String(month).padStart(2,'0')}/${String(day).padStart(2,'0')} ${hour}:${minute}:${second}`;
}
function renderLockDate(){
 const saved=localStorage.getItem(LOCK_DATE_KEY) || DEFAULT_LOCK_DATETIME;
 lockDatePicker.value=saved;
 lockDateText.textContent=formatRocDateTime(saved);
}
lockDatePicker.addEventListener('change',()=>{
 if(!lockDatePicker.value)return;
 let value=lockDatePicker.value;
 if(value.length===16)value+=':00';
 localStorage.setItem(LOCK_DATE_KEY,value);
 renderLockDate();
});
renderLockDate();
</script>
